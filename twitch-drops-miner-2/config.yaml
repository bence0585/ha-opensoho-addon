name: Twitch Drops Miner 2
version: "1.1.0"
slug: twitch_drops_miner_2
description: Twitch drop-ok automatikus gyűjtése (AFK), webes felülettel
url: https://github.com/fireph/docker-twitch-drops-miner
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
map:
  - share:rw
timeout: 60
ports:
  5800/tcp: 5801
ports_description:
  5800/tcp: Webes felület, 2. fiók (Twitch bejelentkezés, játékok kiválasztása)
webui: "http://[HOST]:[PORT:5800]/"
options:
  timezone: Europe/Budapest
schema:
  timezone: str
