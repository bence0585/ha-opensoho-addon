name: OpenSOHO (dev)
version: "0.1.0"
slug: opensoho_dev
description: Az OpenSOHO fork (bence0585/opensoho) tesztpéldánya a 8091-es porton, az éles adatbázis másolatával. A routerek nem ehhez kapcsolódnak.
url: https://github.com/bence0585/opensoho
arch:
  - amd64
  - aarch64
startup: application
boot: manual
map:
  - addon_config:ro
ports:
  8091/tcp: 8091
ports_description:
  8091/tcp: OpenSOHO (dev) webes felület
webui: "http://[HOST]:[PORT:8091]/_/"
options:
  shared_secret: ""
  seed_backup: "pb_backup.zip"
schema:
  shared_secret: password
  seed_backup: str
