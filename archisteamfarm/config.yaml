name: ArchiSteamFarm
version: "1.0.1"
slug: archisteamfarm
description: Steam kártyagyűjtés (ArchiSteamFarm), több fiókkal, webes felülettel (ASF-ui)
url: https://github.com/JustArchiNET/ArchiSteamFarm
arch:
  - amd64
startup: application
boot: auto
init: false
timeout: 60
ports:
  1242/tcp: 1242
ports_description:
  1242/tcp: Webes felület (ASF-ui) és IPC API, jelszóval védve
webui: "http://[HOST]:[PORT:1242]/"
options:
  ipc_password: ""
schema:
  ipc_password: password
